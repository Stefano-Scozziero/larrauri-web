<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <style>
    #light { display: inline; }
    #dark  { display: none;  }
    @media (prefers-color-scheme: dark) {
      #light { display: none; }
      #dark  { display: inline; }
    }
  </style>
  <image id="light" href="data:image/png;base64," x="0" y="0" width="128" height="128" />
  <image id="dark"  href="data:image/png;base64,"  x="0" y="0" width="128" height="128" />
</svg>